services:
  miniroom:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DATABASE_PATH: /app/data/miniroom.db
    volumes:
      - miniroom-db:/app/data
      - miniroom-uploads:/app/static/uploads

volumes:
  miniroom-db:
  miniroom-uploads:
