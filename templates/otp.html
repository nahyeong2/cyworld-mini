{% extends 'base.html' %}{% block title %}2차 인증 · Miniroom{% endblock %}{% block body %}<main class="auth-wrap"><section class="auth-card otp"><div class="stamp">OTP</div><h1>{{'인증 앱 연결하기' if not verify else '2차 인증'}}</h1>{% if not verify %}<p>Google Authenticator 등에서 QR을 스캔한 뒤 6자리 코드를 입력하세요.</p><img src="{{url_for('otp_qr')}}" alt="OTP 설정 QR 코드"><code>{{secret}}</code>{% else %}<p>인증 앱에 표시된 6자리 코드를 입력하세요.</p>{% endif %}<form method="post" class="stack"><label>인증번호<input class="otp-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" autofocus></label><button class="btn primary">인증 완료</button></form></section></main>{% endblock %}
