{% extends 'base.html' %}
{% block title %}복구 코드 · Miniroom{% endblock %}
{% block body %}<main class="auth-wrap"><section class="editor-card recovery-card"><span class="eyebrow">ONE-TIME RECOVERY</span><h1>복구 코드를 저장하세요</h1><p>각 코드는 한 번만 사용할 수 있으며 이 화면을 나가면 다시 확인할 수 없습니다.</p><div class="recovery-list">{% for code in codes %}<code>{{code}}</code>{% endfor %}</div><button class="btn secondary" data-copy-codes>모두 복사</button><a class="btn primary" href="{{url_for('mini_home',username=g.user.username)}}">저장했습니다</a></section></main>{% endblock %}
