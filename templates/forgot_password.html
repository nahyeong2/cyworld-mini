{% extends 'base.html' %}
{% block title %}비밀번호 재설정 · Miniroom{% endblock %}
{% block body %}<main class="auth-wrap"><section class="auth-card"><div class="stamp">RESET</div><h1>비밀번호 재설정</h1><p>가입 시 저장한 일회용 복구 코드가 필요합니다.</p><form method="post" class="stack"><label>아이디<input name="username" required autocomplete="username"></label><label>복구 코드<input name="recovery_code" required autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX"></label><label>새 비밀번호<input type="password" name="new_password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>새 비밀번호 확인<input type="password" name="new_password_confirm" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="btn primary">비밀번호 재설정</button></form><small><a href="{{url_for('login')}}">로그인으로 돌아가기</a></small></section></main>{% endblock %}
