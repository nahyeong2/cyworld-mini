{% extends 'base.html' %}{% block title %}{{'글 수정' if post else '새 글'}} · Miniroom{% endblock %}{% block body %}<main class="auth-wrap"><section class="editor-card"><span class="eyebrow">MY DIARY</span><h1>{{'기록 다듬기' if post else '오늘의 이야기'}}</h1><form method="post" class="stack"><label>제목<input name="title" maxlength="100" required value="{{post.title if post else ''}}" placeholder="오늘을 한 문장으로"></label><label>오늘의 기분<select name="mood">{% for m in ['좋음','설렘','평온','그리움','속상함'] %}<option {{'selected' if post and post.mood==m}}>{{m}}</option>{% endfor %}</select></label><label>내용<textarea name="body" rows="12" maxlength="5000" required placeholder="천천히, 오래 남기고 싶은 이야기를 적어보세요.">{{post.body if post else ''}}</textarea></label><button class="btn primary">저장하기</button></form></section></main>{% endblock %}
