{% extends 'base.html' %}
{% block title %}계정 보안 · Miniroom{% endblock %}
{% block body %}
<main class="security-page">
  <header><span class="eyebrow">ACCOUNT SECURITY</span><h1>계정 보안</h1><p>중요한 변경에는 현재 비밀번호와 OTP가 모두 필요합니다.</p></header>
  <div class="security-grid">
    <section class="security-card"><h2>비밀번호 변경</h2><p>변경하면 다른 기기의 로그인 세션은 즉시 종료됩니다.</p><form method="post" class="stack"><input type="hidden" name="action" value="change_password"><label>현재 비밀번호<input type="password" name="current_password" required autocomplete="current-password"></label><label>현재 OTP<input name="otp_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>새 비밀번호<input type="password" name="new_password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>새 비밀번호 확인<input type="password" name="new_password_confirm" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="btn primary">비밀번호 변경</button></form></section>
    <section class="security-card"><h2>복구 코드</h2><p>비밀번호를 잊었을 때 사용할 일회용 코드입니다. 남은 코드: <b>{{remaining}}</b>개</p><form method="post" class="stack"><input type="hidden" name="action" value="recovery_codes"><label>현재 비밀번호<input type="password" name="current_password" required autocomplete="current-password"></label><label>현재 OTP<input name="otp_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn secondary">새 복구 코드 발급</button></form></section>
  </div>
</main>
{% endblock %}
